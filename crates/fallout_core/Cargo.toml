[package]
name = "fallout-se-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Core save parsing/query library for Fallout 1 & 2"
readme.workspace = true
homepage.workspace = true
keywords = ["fallout", "save-editor", "game", "rpg", "parser"]
categories = ["game-development", "parser-implementations"]

[lib]
name = "fallout_core"

[dependencies]
flate2 = "1.1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = { version = "1", optional = true }

[features]
experimental-rpu-cli = ["dep:serde_json"]
experimental-rpu-browser = ["dep:serde_json"]

[dev-dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Wdk_Foundation", "Wdk_Storage_FileSystem"] }
